services:
  - type: web
    name: vendhub
    runtime: docker
    plan: free
    healthCheckPath: /products
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: FORCE_HTTPS
        value: "false"
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: "3600"
      - key: RUN_DATABASE_INSTALL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: TRUSTED_PROXIES
        value: ""
